# Continuous integration: every push and pull request must pass all of this.
#
# A failing test, lint error, type error or Terraform validation failure fails
# the build - nothing here is allowed to "continue on error".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    # Tests run against a real PostgreSQL instance, exactly like local
    # development, so database constraints are genuinely exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coursepulse
          POSTGRES_PASSWORD: coursepulse
          POSTGRES_DB: coursepulse_pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://coursepulse:coursepulse@localhost:5432/coursepulse_pytest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Check formatting (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Tests (pytest)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

      - name: Verify migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        # `alembic check` fails if a model change has no matching migration.
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive

      # -backend=false: validation needs no state and no AWS credentials.
      - name: Initialise
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the Compose file
        run: docker compose config --quiet
